# CKSMPBlackMarket - network-wide black market auctions.
# Every shard must carry the same file. State lives in CKSMPCore's Postgres; shards are synced over Redis.

# Show broadcasts / boss bar / menu on this shard.
participate: true

leader:
  # One eligible shard at a time runs the scheduler (Postgres lease, automatic failover).
  # Set false on shards that should never drive events (e.g. a lobby).
  eligible: true
  lease-seconds: 15

schedule:
  zone: "America/New_York"
  # Daily start times (HH:mm, 24h) in the zone above. Empty list = manual starts only.
  times:
    - "18:00"
    - "21:30"
  # Restrict to days of the week (MONDAY..SUNDAY). Empty = every day.
  days: []
  # Announcement window before the first round of a scheduled event.
  announce-seconds: 120
  # Seconds-remaining marks that trigger a countdown broadcast.
  announce-at: [120, 60, 30, 10]
  # Announcement window for /blackmarket start.
  manual-announce-seconds: 30
  # A slot missed by more than this (server was down) is skipped, not run late.
  late-grace-seconds: 300
  # Network-wide players required for an event to actually begin. 0 disables the check.
  min-online-players: 1

event:
  rounds: 5
  break-seconds: 15

round:
  duration-seconds: 90
  # A bid placed with less than window-seconds left pushes the end to extend-seconds from now.
  anti-snipe:
    window-seconds: 10
    extend-seconds: 10

bidding:
  cooldown-ms: 750
  # Broadcast every bid server-wide. Off by default (spammy); the outbid player is always notified.
  broadcast-bids: false

history:
  size: 8

announcements:
  # Per-player opt-out, stored in CKSMPCore's native player settings (settings.player.<key> in Core's config.yml
  # plus a network-boolean item in its settings menu). Players without the key receive broadcasts.
  setting-key: "blackmarket-announcements"

discord:
  # Post event starts and round winners to Core's Discord chat relay (sent by the leader shard only).
  enabled: true
  sender: "Black Market"

bossbar:
  enabled: true
  color: PURPLE
  overlay: PROGRESS

# Sounds: set `sound` to "" to disable one.
sounds:
  event-announce: { sound: "minecraft:block.bell.use", source: MASTER, volume: 0.8, pitch: 0.7 }
  round-start: { sound: "minecraft:block.end_portal.spawn", source: MASTER, volume: 0.4, pitch: 1.4 }
  bid-success: { sound: "minecraft:entity.experience_orb.pickup", source: MASTER, volume: 1.0, pitch: 1.3 }
  bid-fail: { sound: "minecraft:entity.villager.no", source: MASTER, volume: 1.0, pitch: 1.0 }
  outbid: { sound: "minecraft:block.note_block.bass", source: MASTER, volume: 1.0, pitch: 0.6 }
  win: { sound: "minecraft:ui.toast.challenge_complete", source: MASTER, volume: 1.0, pitch: 1.0 }
  menu-open: { sound: "minecraft:block.ender_chest.open", source: MASTER, volume: 0.6, pitch: 0.8 }
