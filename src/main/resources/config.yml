# CKSMPBlackMarket - network-wide black market auctions (the AxDarkAuctions successor for Crescent Kingdom).
# Keep this file identical on every shard. State lives in CKSMPCore's Postgres; shards are synced over Redis.
# Prizes are managed in-game with /blackmarket editor (items.yml only seeds an empty database once).

# Show broadcasts / boss bar / menu on this shard.
participate: true

leader:
  # One eligible shard at a time runs the scheduler (Postgres lease, automatic failover).
  # Set false on shards that should never drive events (e.g. a lobby).
  eligible: true
  lease-seconds: 15

# ----- when events happen -----
schedule:
  # Same clock model as CKSMPMobs: an event starts every interval-minutes counted from midnight of this zone,
  # plus offset-minutes. UTC keeps every shard in sync. interval 120 + offset 30 = 00:30, 02:30, 04:30, ...
  # (set interval-minutes to 60 for every hour at :30). Must be identical on every shard.
  zone: "UTC"
  interval-minutes: 120
  offset-minutes: 30
  # Alternative to the interval: fixed daily start times (HH:mm in the zone above). Used only when
  # interval-minutes is 0. Empty list too = manual starts only (/blackmarket start).
  times: []
  # Restrict to days of the week (MONDAY..SUNDAY). Empty = every day.
  days: []
  # How long before the first item the event is announced (AxDarkAuctions: start-wait-time).
  announce-seconds: 60
  # Seconds-remaining marks that send the "is starting in X seconds" broadcast (AxDarkAuctions: starting-broadcast).
  announce-at: [60, 50, 40, 30, 20, 10]
  # Announcement window for /blackmarket start.
  manual-announce-seconds: 30
  # A slot missed by more than this (server was down) is skipped, not run late.
  late-grace-seconds: 300
  # Network-wide players required for an event to actually begin. 0 disables the check.
  min-online-players: 1

event:
  # How many items are auctioned per event.
  rounds: 5
  # Wait between the winner announcement and the next item (AxDarkAuctions: time-between-bids).
  break-seconds: 5

# ----- one item -----
round:
  # The item is shown but cannot be bid on yet (AxDarkAuctions: show-time).
  preview-seconds: 5
  # How long it can be bid on (AxDarkAuctions: bid-time).
  duration-seconds: 15
  # A bid placed with less than window-seconds left pushes the end to extend-seconds from now
  # (AxDarkAuctions: extend-bid-time / extend-time).
  anti-snipe:
    window-seconds: 8
    extend-seconds: 8

bidding:
  cooldown-ms: 750
  # Broadcast every bid, like AxDarkAuctions does. Players can opt out with the announcement setting below.
  broadcast-bids: true

history:
  size: 8

announcements:
  # Per-player opt-out, stored in CKSMPCore's native player settings (settings.player.<key> in Core's config.yml
  # plus a network-boolean item in its settings menu). Players without the key receive broadcasts.
  setting-key: "blackmarket-announcements"

editor:
  # /blackmarket editor: left-click adds a step, right-click removes one, shift multiplies it.
  bid-step: 100
  increment-step: 10
  percent-step: 0.01
  shift-multiplier: 10

discord:
  # Post event starts and round winners to Core's Discord chat relay (sent by the leader shard only).
  enabled: true
  sender: "Black Market"

bossbar:
  enabled: true
  color: PURPLE
  overlay: PROGRESS

# Sounds: set `sound` to "" to disable one.
sounds:
  event-announce: { sound: "minecraft:block.bell.use", source: MASTER, volume: 0.8, pitch: 0.7 }
  round-start: { sound: "minecraft:block.end_portal.spawn", source: MASTER, volume: 0.4, pitch: 1.4 }
  bidding-open: { sound: "minecraft:block.note_block.pling", source: MASTER, volume: 0.8, pitch: 1.2 }
  bid-success: { sound: "minecraft:entity.experience_orb.pickup", source: MASTER, volume: 1.0, pitch: 1.3 }
  bid-fail: { sound: "minecraft:entity.villager.no", source: MASTER, volume: 1.0, pitch: 1.0 }
  outbid: { sound: "minecraft:block.note_block.bass", source: MASTER, volume: 1.0, pitch: 0.6 }
  win: { sound: "minecraft:ui.toast.challenge_complete", source: MASTER, volume: 1.0, pitch: 1.0 }
  menu-open: { sound: "minecraft:block.ender_chest.open", source: MASTER, volume: 0.6, pitch: 0.8 }
