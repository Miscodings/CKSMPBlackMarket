# Same layout and wording as AxDarkAuctions' main.yml / preview.yml.
# Placeholders: <item> <round> <rounds> <current-bid> <next-bid> <start-bid> <leader> <player> <bids>
#               <time> (e.g. 1m 5s)  <seconds> (plain number)  <opens-in> (plain number)  <balance>
#
# Two phases share one inventory size: `preview` (item on show, bids not open yet) and `bidding`.
# The `bid` button's material comes from `bid-materials` (by the amount of the next bid); the `leading`
# button replaces it while the viewer holds the top bid and shows their own head.
menu:
  rows: 6

  #fill:
  #  material: BLACK_STAINED_GLASS_PANE
  #  name: ' '

  bidding:
    title: "<black><b>Dark Auction > </b>Bidding"
    items:
      reward:
        function: reward
        slot: 4
      clock:
        function: clock
        slot: 22
        material: CLOCK
        name: "<#D200FF><b>Bidding"
        lore:
          - " "
          - " <#DDDDDD>- <white>Ends in: <#D200FF><seconds> seconds"
          - " "
      bid:
        function: bid
        slot: 31
        material: GOLD_INGOT
        name: "<#D200FF>Bid <#7700FF><next-bid>"
        lore:
          - " "
          - " <#DDDDDD>- <white>Top bid: <#D200FF><current-bid>"
          - " <#DDDDDD>- <white>Your balance: <#D200FF><balance>"
          - " "
          - "<#D200FF><b>> <#D200FF>Click here to place your bid!"

  preview:
    title: "<black><b>Dark Auction > </b>Next Bid"
    items:
      reward:
        function: reward
        slot: 4
      clock:
        function: clock
        slot: 22
        material: CLOCK
        name: "<#D200FF><b>Bidding"
        lore:
          - " "
          - " <#DDDDDD>- <white>Starts in: <#D200FF><opens-in> seconds"
          - " "
          - "<#D200FF><b>> <#D200FF>Get ready!"

  # The number is the next-bid amount where this material starts to be used.
  bid-materials:
    '0': IRON_INGOT
    '10000': GOLD_INGOT
    '100000': DIAMOND
    '1000000': EMERALD
    '10000000': NETHERITE_INGOT

  leading:
    material: PLAYER_HEAD
    name: "<#D200FF>Bid <#7700FF><current-bid>"
    lore:
      - " "
      - " <#DDDDDD>- <#D200FF>You <white>already bid this amount!"
      - " "
      - "<#D200FF><b>> <#D200FF>You are the top bidder!"
