# MiniMessage everywhere (<#RRGGBB>, <gray>, <bold>, <gradient:#7700FF:#FF00FF>).
# <prefix> is available in every message; lines starting with <center> are centred in chat.
# Palette matches AxDarkAuctions: #7700FF / #D200FF / #DDDDDD, green #00FF00, red #FF0000 / #BB0000.

prefix: "<#7700FF><b>BLACK MARKET</b></#7700FF> <gray>»</gray>"

# <amount> is the formatted number.
money-format: "<#86fe8a>$<amount>"
no-leader-name: "<#DDDDDD>nobody yet"

# Unit letters used wherever a time is shown, e.g. "1h 5m 20s".
time:
  second: s
  minute: m
  hour: h
  day: d

help:
  player:
    - " "
    - "<gradient:#7700FF:#FF00FF><b>Black Market</b></gradient> <gray>»"
    - " <gray>- <white>/blackmarket <gray>| <#D200FF>Open the bidding menu!"
    - " <gray>- <white>/blackmarket info <gray>| <#D200FF>Show when the next dark auction starts!"
    - " <gray>- <white>/blackmarket history <gray>| <#D200FF>See who won recently!"
    - " "
  admin:
    - "<gradient:#7700FF:#FF00FF><b>Black Market Admin</b></gradient> <gray>»"
    - " <gray>- <white>/blackmarket start <gray>| <#D200FF>Start a dark auction!"
    - " <gray>- <white>/blackmarket stop <gray>| <#D200FF>Stop the dark auction (refunds the top bid)!"
    - " <gray>- <white>/blackmarket skip <gray>| <#D200FF>End the current item now!"
    - " <gray>- <white>/blackmarket editor <gray>| <#D200FF>Open the prize editor!"
    - " <gray>- <white>/blackmarket reload <gray>| <#D200FF>Reload plugin"
    - " "

menu:
  idle-name: "<#D200FF>No dark auction right now"
  idle-lore:
    - " "
    - " <#DDDDDD>- <white>Next one in: <#D200FF><time>"
  idle-none: "<#DDDDDD>nothing scheduled"

general:
  reloaded: "<prefix> <#33FF33>Plugin successfully reloaded!"
  reload-failed: "<prefix> <#FF3333>Failed to reload the plugin! <white><error>"
  player-only: "<prefix> <#FF0000>You must be a player to use this command!"
  not-participating: "<prefix> <#FF0000>The dark auction is not held on this server!"

bid:
  no-round: "<prefix> <#FF0000>The dark auction is not running!"
  not-open: "<prefix> <#FF0000>The bidding has not started yet!"
  already-leading: "<prefix> <#FF0000>You are already the top bidder!"
  insufficient: "<prefix> <#FF0000>You can not afford to bid <white><amount><#FF0000>, you only have <white><balance><#FF0000>!"
  withdraw-failed: "<prefix> <#FF0000>Your payment could not be taken. Try again!"
  outraced: "<prefix> <#FF0000>Somebody already bid more than this amount! <#DDDDDD>(<white><amount><#DDDDDD> returned)"
  error: "<prefix> <#FF0000>Your bid failed. <#DDDDDD>(<white><amount><#DDDDDD> returned)"
  placed: "<prefix> <#D200FF>You are now the top bidder with <white><amount><#D200FF>!"
  outbid: "<prefix> <white><player> <#D200FF>outbid you on <white><item><#D200FF>! <#DDDDDD>(<white><amount><#DDDDDD> returned)"
  broadcast: "<prefix> <white><player> <#D200FF>has bid <white><amount><#D200FF>! There are still <white><seconds> <#D200FF>seconds left!"

payout:
  refund: "<prefix> <#D200FF>You got <white><amount> <#D200FF>back!"
  reward: "<prefix> <#D200FF>Your prize has arrived: <white><item><#D200FF>!"
  stashed: "<prefix> <#D200FF>Your inventory was full, so part of your prize is waiting in <white>/stashbox<#D200FF>!"
  reward-missing: "<prefix> <#FF0000>The prize <white><id> <#FF0000>no longer exists, contact staff!"

event:
  announce:
    - " "
    - "<#D200FF>The <white>Black Market<#D200FF> is starting in <white><seconds> <#D200FF>seconds!"
    - "<#DDDDDD>Join with /blackmarket!"
    - " "
  started: "<prefix> <#D200FF>The dark auction is starting! Get ready!"
  finished: "<prefix> <#D200FF>There are no more items to be auctioned! Today's dark auction is over, come back next time!"
  cancelled-low-players: "<prefix> <#D200FF>There are not enough players, so the dark auction is not going to be held!"
  cancelled-admin: "<prefix> <#D200FF>The dark auction was stopped by an admin, all bids were returned!"

round:
  waiting: "<prefix> <#D200FF>The next item will be announced in <white><seconds> <#D200FF>seconds!"
  showing: "<prefix> <#D200FF>The next item that you can bid for is: <white><item><#D200FF>, the starting price is: <white><start-bid><#D200FF>! The bidding will start in <white><opens-in> <#D200FF>seconds!"
  bidding: "<prefix> <#D200FF>The bidding has started for the following item: <white><item><#D200FF>, at the starting price of <white><start-bid><#D200FF>! The winner will be announced in <white><seconds> <#D200FF>seconds!"
  no-bids: "<prefix> <#D200FF>Nobody has bid on the item <white><item><#D200FF>!"
  won: "<prefix> <white><player> <#D200FF>has won the <white><item> <#D200FF>for <white><amount><#D200FF>!"
  you-won: "<prefix> <#00FF00>You won <white><item><#00FF00>!"

bossbar:
  preview: "<#D200FF>Next item: <white><item> <#DDDDDD>• <#D200FF>bidding opens in <white><opens-in>s"
  title: "<#D200FF><item> <#DDDDDD>• <#D200FF>top bid <white><amount> <#DDDDDD>• <white><seconds>s"

status:
  active: "<prefix> <#D200FF>Round <white><round>/<rounds><#D200FF>: <white><item><#D200FF>, top bid <white><amount> <#D200FF>by <white><player><#D200FF>, <white><seconds> <#D200FF>seconds left!"
  idle-next: "<prefix> <#D200FF>The next dark auction will be in <white><time><#D200FF>!"
  idle-none: "<prefix> <#D200FF>There is no dark auction scheduled right now!"

history:
  header: "<prefix> <#D200FF>Recent winners:"
  line: " <#DDDDDD>- <white><player> <#D200FF>won <white><item> <#D200FF>for <white><amount> <#DDDDDD>(<ago> ago)"
  empty: "<prefix> <#D200FF>Nothing has been sold yet!"

discord:
  event-start: "The Black Market is starting in <seconds> seconds with <rounds> secret items!"
  round-won: "<player> has won the <item> for <amount> at the Black Market!"

editor:
  list:
    title: "<#7700FF><b>Black Market</b> <black>> Prize Pool"
    prev: "<#D200FF>Previous page"
    next: "<#D200FF>Next page"
    close: "<#FF0000>Close"
    page: "<#DDDDDD>Page <white><page><#DDDDDD>/<white><pages> <#DDDDDD>• <white><count> <#DDDDDD>prizes"
    help-name: "<#D200FF><b>How this works"
    help-lore:
      - " "
      - " <#DDDDDD>- <white>Drop an item on an empty slot, or shift-click"
      - "   <white>one from your inventory, to add it as a prize."
      - " <#DDDDDD>- <white>It is saved exactly as it is, custom enchants and all."
      - " <#DDDDDD>- <white>Left-click a prize to edit it."
      - " <#DDDDDD>- <white>Right-click a prize to switch it on or off."
    add-name: "<#00FF00><b>Add a prize"
    add-lore:
      - " "
      - " <#DDDDDD>- <white>Drop an item here, or shift-click"
      - "   <white>one from your inventory."
    prize-lore:
      - " "
      - " <#DDDDDD>- <white>Weight: <#D200FF><weight>"
      - " <#DDDDDD>- <white>Starting bid: <start-bid>"
      - " <#DDDDDD>- <white>Status: <status>"
      - " "
      - "<#D200FF><b>> <#D200FF>Left-click to edit"
      - "<#D200FF><b>> <#D200FF>Right-click to toggle"
    status-on: "<#00FF00>enabled"
    status-off: "<#FF0000>disabled"
  detail:
    title: "<#7700FF><b>Black Market</b> <black>> Edit Prize"
    back: "<#D200FF>Back to the prize pool"
    adjust-hint:
      - " "
      - "<#D200FF><b>> <#D200FF>Left-click: <white>+<step>"
      - "<#D200FF><b>> <#D200FF>Right-click: <white>-<step>"
      - "<#D200FF><b>> <#D200FF>Hold shift for <white>x<multiplier>"
    weight-name: "<#D200FF><b>Weight <#DDDDDD>(<white><value><#DDDDDD>)"
    weight-lore:
      - " "
      - " <#DDDDDD>- <white>Higher means drawn more often."
    start-name: "<#D200FF><b>Starting bid <#DDDDDD>(<value><#DDDDDD>)"
    start-lore:
      - " "
      - " <#DDDDDD>- <white>The first bid must be at least this."
    increment-name: "<#D200FF><b>Minimum raise <#DDDDDD>(<value><#DDDDDD>)"
    increment-lore:
      - " "
      - " <#DDDDDD>- <white>Each bid must beat the last by at least"
      - "   <white>this or the percentage below."
    percent-name: "<#D200FF><b>Raise percentage <#DDDDDD>(<white><value>%<#DDDDDD>)"
    percent-lore:
      - " "
      - " <#DDDDDD>- <white>The larger of the minimum raise and"
      - "   <white>this share of the current bid applies."
    enabled-name: "<#D200FF><b>Status: <status>"
    enabled-lore:
      - " "
      - " <#DDDDDD>- <white>Disabled prizes are never drawn."
      - " "
      - "<#D200FF><b>> <#D200FF>Click to toggle"
    rewards-name: "<#D200FF><b>Prize items"
    rewards-lore:
      - " "
      - " <#DDDDDD>- <white>Items given to the winner: <#D200FF><count>"
      - " "
      - "<#D200FF><b>> <#D200FF>Click to drop items in or take them out"
    commands-name: "<#D200FF><b>Console commands"
    commands-lore:
      - " "
      - " <#DDDDDD>- <white>Commands run on win: <#D200FF><count>"
      - " <#DDDDDD>- <white>Set these through items.yml (first start)."
    give-name: "<#00FF00><b>Give me a copy"
    give-lore:
      - " "
      - " <#DDDDDD>- <white>Check that the prize looks right."
    delete-name: "<#FF0000><b>Delete this prize"
    delete-lore:
      - " "
      - "<#D200FF><b>> <#D200FF>Click twice within 5 seconds"
    delete-confirm-name: "<#FF0000><b>Click again to delete!"
  rewards:
    title: "<#7700FF><b>Black Market</b> <black>> Prize Items"
    save-name: "<#00FF00><b>Save and go back"
    info-name: "<#D200FF><b>Prize items"
    info-lore:
      - " "
      - " <#DDDDDD>- <white>Everything in the top 5 rows is given"
      - "   <white>to the winner, exactly as it is here."
      - " <#DDDDDD>- <white>Drop items in, take them out, then save."
  msg:
    added: "<prefix> <#D200FF>Added <white><item> <#D200FF>to the pool as <white><id><#D200FF>! Set its bids in the editor."
    deleted: "<prefix> <#FF0000>You have deleted the <white><id> <#FF0000>prize!"
    delete-armed: "<prefix> <#D200FF>Click delete again within 5 seconds to remove <white><id><#D200FF>."
    rewards-saved: "<prefix> <#00FF00>Saved <white><count> <#00FF00>prize item(s)!"
    rewards-empty: "<prefix> <#FF0000>No items and no commands, so <white><id> <#FF0000>was switched off!"
    too-many: "<prefix> <#FF0000>Only the first <max> stacks fit, the rest were not saved!"
    given: "<prefix> <#00FF00>You got a copy of <white><id><#00FF00>!"
    not-an-item: "<prefix> <#FF0000>That is not an item!"
    gone: "<prefix> <#FF0000>That prize no longer exists!"

admin:
  start-sent: "<prefix> <#00FF00>You have started the dark auction!"
  stop-sent: "<prefix> <#00FF00>You have stopped the dark auction!"
  skip-sent: "<prefix> <#00FF00>You have ended the current item!"
  no-leader: "<prefix> <#FF0000>No server is running the dark auction scheduler right now!"
